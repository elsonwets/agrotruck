[build]
  command = "pnpm build"
  publish = "out"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "11.6.0"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type = "application/javascript; charset=utf-8"
    Service-Worker-Allowed = "/"

[[redirects]]
  from = "/api/reviews/:slug"
  to = "/.netlify/functions/reviews?slug=:slug"
  status = 200
